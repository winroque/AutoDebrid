<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoDebrid</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>⚡ AutoDebrid</h1>
    <span id="account-badge" class="hidden"></span>
  </header>

  <!-- Tela de configuração da chave -->
  <section id="setup" class="hidden">
    <div class="provider-choice" id="provider-choice"></div>
    <p><span id="setup-intro">Paste your API key. You can find it at</span>
      <a id="key-link" href="https://real-debrid.com/apitoken" target="_blank" rel="noopener">real-debrid.com/apitoken</a>.
    </p>
    <input type="password" id="token-input" data-i18n-placeholder="tokenPlaceholder" placeholder="API key" autocomplete="off">
    <button id="save-token" class="primary" data-i18n="saveToken">Save and validate</button>
    <p id="setup-status" class="status"></p>
    <button id="setup-cancel" class="link-button hidden" data-i18n="cancel">Cancel</button>
  </section>

  <!-- Tela principal -->
  <section id="main" class="hidden">
    <div class="settings">
      <label class="row"><span data-i18n="serviceLabel">Service</span>
        <select id="provider-select"></select>
      </label>
      <label><input type="checkbox" id="opt-intercept"> <span data-i18n="optIntercept">Unrestrict automatically when clicking links</span></label>
      <label><input type="checkbox" id="opt-badges"> <span data-i18n="optBadges">Show ⚡ button next to links</span></label>
      <label><input type="checkbox" id="opt-newtab"> <span data-i18n="optNewTab">Open unrestricted link in a new tab</span></label>
    </div>

    <details id="hosters" class="hosters">
      <summary><span data-i18n="hostersHeading">Supported hosters</span> <span id="hosters-count" class="count"></span></summary>
      <p class="hint" data-i18n="hostersHint">Disabled hosters are left alone: no ⚡ badge and no click interception.</p>
      <div class="hosters-tools">
        <input type="text" id="hosters-filter" data-i18n-placeholder="hostersFilter" placeholder="Filter…">
        <button id="hosters-all" data-i18n="enableAll">Enable all</button>
        <button id="hosters-none" data-i18n="disableAll">Disable all</button>
        <button id="hosters-refresh" data-i18n-title="refreshTitle" title="Reload list">↻</button>
      </div>
      <p id="hosters-status" class="status"></p>
      <ul id="hosters-list"></ul>
    </details>

    <div class="page-links">
      <div class="page-links-header">
        <h2 data-i18n="linksHeading">Links on this page</h2>
        <button id="refresh-links" data-i18n-title="refreshTitle" title="Reload list">↻</button>
      </div>
      <p id="links-status" class="status"></p>
      <button id="try-all" class="primary hidden" data-i18n="tryAll">🔁 Try mirrors (uses the first one that works)</button>
      <ul id="links-list"></ul>
    </div>

    <div id="result" class="result hidden">
      <h2 data-i18n="resultHeading">✅ Link ready</h2>
      <p id="result-name" class="result-name"></p>
      <p id="result-meta" class="result-meta"></p>
      <div class="result-actions">
        <a id="result-open" class="button primary" target="_blank" rel="noopener" data-i18n="openDownload">Open / Download</a>
        <button id="result-copy" data-i18n="copyLink">Copy link</button>
      </div>
    </div>

    <footer>
      <button id="change-token" class="link-button" data-i18n="changeToken">Change API key</button>
    </footer>
  </section>

  <script src="popup.js"></script>
</body>
</html>
